# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Connect this repo on Render (New > Blueprint) and it provisions a free
# Postgres database plus this web service, wired together automatically.
# Verify field names against Render's current blueprint docs if the
# blueprint fails to parse — the spec has changed over time.

services:
  - type: web
    name: studentnest
    runtime: node
    plan: free
    branch: claude/hello-32rim1
    buildCommand: npm install && npm run build
    startCommand: npm run db:deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studentnest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: studentnest-db
    plan: free
    databaseName: studentnest
    user: studentnest
