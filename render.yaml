# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Connect this repo on Render (New > Blueprint) and it provisions a free
# Postgres database plus this web service, wired together automatically —
# no separate DB signup or connection-string copying needed.
#
# Render's free Postgres is deleted 30 days after creation. Fine for
# testing/demoing; if this needs to stay up long-term, migrate DATABASE_URL
# to a persistent host (Neon/Supabase) before then.
#
# startCommand runs migrations then the (idempotent) seed script on every
# boot, so the first deploy provisions the schema and seed data without
# needing a manual shell session. Verify field names against Render's
# current blueprint docs if the blueprint fails to parse — the spec has
# changed over time and this hasn't been tested against a live account.

services:
  - type: web
    name: studentnest
    runtime: node
    plan: free
    branch: claude/hello-32rim1
    buildCommand: npm install && npm run build
    startCommand: npm run db:deploy && npm run db:seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studentnest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: studentnest-db
    plan: free
    databaseName: studentnest
    user: studentnest
